<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="note-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Notes Toolkit</p>
          <h1>Quick note</h1>
        </div>
        <button id="theme-toggle" type="button">Dark mode</button>
      </header>

      <label for="note-text">Your note</label>
      <textarea id="note-text" rows="10" placeholder="Write a note..."></textarea>

      <div class="note-meta" aria-live="polite">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn" class="clear-button" type="button">Clear note</button>
    </main>
  </body>
</html>
